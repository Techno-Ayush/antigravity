services:
  - type: web
    name: p2p-skill-exchange
    env: node
    region: oregon
    plan: free
    buildCommand: npm run build
    startCommand: NODE_ENV=production node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
